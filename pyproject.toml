[project]
name = "congress-tweets-meet-sae"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "geopandas",
    "matplotlib",
    "requests[socks]",
    "tqdm",
    "nomic",
    "pyreadr",
    "h5py",
    "huggingface_hub",
    "hf_transfer",
    "jupyter",
    "notebook",
    "rich",
    "captum",
    "torch",
    "transformers",
    "accelerate",
    "jinja2",
    "tensorboard",
    "torch-tb-profiler",
    "unique-namer",
    "py-spy",
    "openai",
    "httpx[socks]>=0.28.1",
    "omegaconf>=2.4.0",
    "hf-xet>=1.5.2",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[project.scripts]
hfsync = "scripts.hfsync:main"
hsync = "scripts.hfsync:main"

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
